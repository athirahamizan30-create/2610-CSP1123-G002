<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Registration Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">     
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styleindex.css') }}">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="row main-card shadow-lg no-gutters w-100" style="max-width: 850px;">
        
        <div class="col-md-6 form-side p-5 bg-white">
            
            {% if errors %}
            <div class="alert alert-danger py-2 px-3 small mb-4">
                <ul class="mb-0 pl-3">
                    {% for e in errors %}
                    <li>{{ e }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}

            <form action="{{ url_for('register') }}" method="POST">
                <h1 class="mb-4 font-weight-bold">Create your account</h1>

                <div class="form-group">
                    <label for="username" class="small font-weight-bold">Username</label>
                    <input type="text" class="form-control form-control-lg custom-input" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="email" class="small font-weight-bold">Email</label>
                    <input type="email" class="form-control form-control-lg custom-input" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password" class="small font-weight-bold">Password</label>
                    <input type="password" class="form-control form-control-lg custom-input" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="small font-weight-bold">Confirm Password</label>
                    <input type="password" class="form-control form-control-lg custom-input" id="confirm_password" name="confirm_password" required>
                </div>

                <button type="submit" class="btn btn-custom btn-block btn-lg mt-4">
                    Create account
                </button>

                <p class="mt-4 text-muted text-center small">
                    Already have an account? 
                    <a href="{{ url_for('index') }}" class="font-weight-bold custom-link">Sign in</a>
                </p>
            </form>
        </div>

        <div class="col-md-6 toggle-side d-none d-md-flex flex-column justify-content-center align-items-center text-center p-5 text-white">
            <h1 class="display-5 font-weight-bold mb-3">Welcome Friend!</h1>
            <p class="px-3">
                To keep connected with us please register with your personal info.
            </p>
        </div>

    </div>
</div>

</body>
</html>
