<!DOCTYPE html>
<html>
<head>
    <title>
        chat
    </title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styleChat.css') }}">
</head>

<body>
{% extends "base.html" %}

{% block content %}

<h2>Welcome, <span id="username">{{username}}</span></h2>
<div class="container">

    <div class="sidebar">
        <div class="room-list">
            <h3>Rooms</h3>
            {% for room in rooms %}
            <div class="room-item" onclick="joinRoom('{{room}}')">
                {{room}}
            </div>
            {% endfor %}
        </div>

        <div class="user-list">
            <h3>Online Users</h3>
            <div id="active-users"></div>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <h3 id="chat-title">General</h3>
        </div>
        <div id="chat"></div>

        <div class="input-area">
            <input
                type="text"
                id="message"
                placeholder="Enter text here.."
                onkeypress="handleKeyPress(event)"
            >
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

</div>
<script src="{{url_for('static', filename='chat.js')}}"></script>
{% endblock %}
</body>
</html>
