{% extends "base.html" %}
{% block content %}

<head>
    <title>
        chat
    </title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='edit_job.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styleChat.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css')}}">
</head>


<script>
    const username = "{{username}}";
</script>

<div class="chat-container">

    <div class="chat-sidebar">
        <div class="room-list">

    <h3>Rooms</h3>

    <button onclick="showRoomForm()">
        + Create Room
    </button>

    <div id="room-form" style="display:none;">
        <form method="POST" action="/create-room">
            <input type="text" name="room_name" placeholder="Room name" required>
            <button type="submit">
                Create
            </button>
        </form>
    </div>

    {% for room in rooms %}
    <div
        class="room-item"
        data-room="{{ room.name }}"
        onclick="joinRoom('{{ room.name }}')">

        {{ room.name }}

    </div>
    {% endfor %}
    </div>

        <div class="user-list">
            <h3>Online Users</h3>
            <div id="active-users"></div>
        </div>

        <div class="recent-list">
        <h3>Recent Chats</h3>
        <div id="recent-chats"></div>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <h3 id="chat-title">General</h3>

            <button id="view-profile-btn" style="display: none;">
            View Profile
            </button>
        </div>

        <div id="chat"></div>

        <div class="input-area">
            <input
                type="text"
                id="message"
                placeholder="Enter text here.."
                onkeypress="handleKeyPress(event)"
            >
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>
<script>
function showRoomForm() {

    const form =
        document.getElementById(
            "room-form"
        );

    if (
        form.style.display ===
        "none"
    ) {
        form.style.display =
            "block";
    } else {
        form.style.display =
            "none";
    }
}
</script>
<script src="{{url_for('static', filename='chat.js')}}"></script>

<div id="profile-popup" class="popup-overlay">

    <div class="popup-card">

        <span class="close-btn" onclick="closeProfilePopup()">
           ×
        </span>

        <img id="popup-profile-pic" class="popup-profile-pic">

        <h2 id="popup-username"></h2>

        <p>
            <strong>Full Name:</strong>
            <span id="popup-fullname"></span>
        </p>

        <p>
            <strong>Email:</strong>
            <span id="popup-email"></span>
        </p>

        <p>
            <strong>About Me:</strong>
            <span id="popup-about"></span>
        </p>

    </div>

</div>

{% include 'job.html' %}


{% endblock %}
