<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styleIndex.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styleReset.css') }}">
</head>

<body>

<div class="container reset-container">

    <!-- RIGHT SIDE FORM -->
    <div class="form-container reset-password">

        <form method="POST">

            <h1>Reset Password</h1>

            <p>
                Create a new password for your account
            </p>


            <div class="form-group">
                <label>New Password</label>

                <input
                    type="password"
                    name="password"
                    required
                >
            </div>

            <div class="form-group">
                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    required
                >
            </div>

            <button type="submit">
                Confirm
            </button>

            <div class="signup_link">
                <p>
                    Remember your password?
                    <a href="{{ url_for('login') }}">
                        Login
                    </a>
                </p>
            </div>

        </form>

    </div>

    <!-- LEFT TOGGLE -->
    <div class="toggle-container reset-toggle">

        <div class="toggle">

            <div class="toggle-panel reset-panel">

                <h1>Welcome Back!</h1>

                <p>
                    Enter your personal details
                    to access your account
                </p>


            </div>

        </div>

    </div>

</div>

</body>
</html>
