<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Registeration Form</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">     
<link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='styleindex.css') }}">
</head>
<body>

<div class="container">
  <div class="form-container forgot-password">
    {% if errors %}
	  <div class="alert alert-danger">
		  <ul >
		    {% for e in errors %}
		    <li>{{e}}</li>
		    {% endfor %}
		  </ul>
	  </div>
	  {% endif %}
  
    <form action="{{ url_for('register') }}" method="POST">

      <h1>Create your account</h1>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Create account
      </button>

      <p class="mt-4 text-muted">
  		Already have an account?
  		<a href="{{ url_for('index') }}" class="text-primary">Sign in</a>
	    </p>

      </div>

      <button type="submit">
        Reset Password
      </button>


  <div class="toggle-container forgot-toggle">
    <div class="toggle">
      <div class="toggle-panel forgot-panel">
        <h1>sadadasdas</h1>
        <p>
          Reset Your Email for a New Password
        </p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
