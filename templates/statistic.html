<!DOCTYPE html>
<html>
<head>
    <title>Statistic</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='stylestatistic.css') }}">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load('current', {'packages':['bar']});
      google.charts.setOnLoadCallback(drawChart);

      function drawChart() {
        var data = google.visualization.arrayToDataTable([
        ['Status', 'Count'],
            {% for status, count in status_data %}
                ['{{ status }}', {{ count }}],
            {% endfor %}
        ]);

        var options = {
          chart: {
            title: 'Status',
            subtitle: 'from may to now',
          }
        };

        var chart = new google.charts.Bar(document.getElementById('columnchart_material'));

        chart.draw(data, google.charts.Bar.convertOptions(options));
    }
    </script>
</head>

<body>
{% extends "base.html" %}

{% block content %}
    <div id="mySidebar" class="sidebar">  
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <h2>My Jobs</h2>

        <a href="/dashboard">Dashboard</a>
        <a href="/add_job">New Application</a>
        <a href="/document">Documents</a>
        <a href="/reminders">Reminders</a>
        <a href="/">Log Out</a>

        <script>
            function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
            document.getElementById("movemain").style.marginLeft = "250px";
            }

        <!--push back the content to the left -->
            function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
            document.getElementById("movemain").style.marginLeft = "0";
            }
        </script>
    </div>

    <div id="movemain" class="main">
        <div class ="header-section">
            <button class="openbtn" onclick="openNav()">&#9776;</button>
            <h1>Statistic</h1>
        </div>

        <div id="columnchart_material" style="width: 800px; height: 500px;"></div>

    </div>
{% endblock %}
</body>
</html>
