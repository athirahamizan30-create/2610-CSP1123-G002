<!DOCTYPE html>
<html>
<head>
    <title>Statistic</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='stylestatistic.css') }}">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load('current', {'packages':['corechart']});
      google.charts.setOnLoadCallback(drawChart);

      function drawChart() {
        var data = google.visualization.arrayToDataTable([
        ['Status', 'Interested', 'Applied', 'Rejected', 'Stage 1', 'Stage 2', 'Interview', 'Accepted'],
        ['Applications Status', 
            {% set counts = {'int': 0, 'app': 0, 'rej': 0, 's1': 0, 's2': 0, 'iv': 0, 'acc': 0} %}
            {% for status, count in status_data %}
                {% if status == 'interested' %}{% set _ = counts.update({'int': count}) %}
                {% elif status == 'applied' %}{% set _ = counts.update({'app': count}) %}
                {% elif status == 'rejected' %}{% set _ = counts.update({'rej': count}) %}
                {% elif status == 'stage 1' %}{% set _ = counts.update({'s1': count}) %}
                {% elif status == 'stage 2' %}{% set _ = counts.update({'s2': count}) %}
                {% elif status == 'interview' %}{% set _ = counts.update({'iv': count}) %}
                {% elif status == 'accepted' %}{% set _ = counts.update({'acc': count}) %}
                {% endif %}
            {% endfor %}
            {{ counts.int }}, {{ counts.app }}, {{ counts.rej }}, {{ counts.s1 }}, {{ counts.s2 }}, {{ counts.iv }}, {{ counts.acc }}
        ]
        ]);

        var options = {
            title: 'Application Status Data',
            colors: ['#ffff99', '#99ffff', '#ff3333', '#99ccff', '#0080ff', '#00cccc', '#00CC00'],
            legend: { position: 'top', maxLines: 3 },
            bar: { groupWidth: '100%' }
        };

        var chart = new google.visualization.ColumnChart(document.getElementById('columnchart_material'));

        chart.draw(data, options);
    }
    </script>
</head>

<body>
{% extends "base.html" %}

{% block content %}
    <div id="mySidebar" class="sidebar">  
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <h2>My Jobs</h2>

        <a href="/dashboard">Dashboard</a>
        <a href="/add_job">New Application</a>
        <a href="/document">Documents</a>
        <a href="/reminders">Reminders</a>
        <a href="/">Log Out</a>

        <script>
            function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
            document.getElementById("movemain").style.marginLeft = "250px";
            }

        <!--push back the content to the left -->
            function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
            document.getElementById("movemain").style.marginLeft = "0";
            }
        </script>
    </div>

    <div id="movemain" class="main">
        <div class ="header-section">
            <button class="openbtn" onclick="openNav()">&#9776;</button>
            <h1>Statistic</h1>
        </div>

        <div id="columnchart_material" style="width: 1200px; height: 750px;"></div>

    </div>
{% endblock %}
</body>
</html>
